[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# React Router uses client-side routing (BrowserRouter), so every path
# needs to fall back to index.html - otherwise refreshing on /editor or
# /ambil-foto directly gives a 404 from Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
