services:
  backend:
    build: ./backend
    container_name: photobox-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=5000
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: photobox-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # "backend" is the other service's name on this Compose network -
      # containers can't reach each other via "localhost".
      - PROXY_TARGET=http://backend:5000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000
